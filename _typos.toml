[default]
# Commit hashes quoted in review files are not words.
extend-ignore-re = ["`[0-9a-f]{7,40}`"]

[default.extend-words]
# Polish words in evaluation questions.
personel = "personel"
# Polish words in test data and in recorded model answers ("yes", "the EU").
tak = "tak"
ue = "ue"

[files]
# Baselines record the model's answers as given, in Polish too; they are output, not prose.
extend-exclude = ["docs/evals/*-baseline.json"]
