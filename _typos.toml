[default]
# Commit hashes quoted in review files are not words.
extend-ignore-re = ["`[0-9a-f]{7,40}`"]

[default.extend-words]
# Polish words in evaluation questions.
personel = "personel"
charakter = "charakter"
# Polish words in test data and in recorded model answers ("yes", "the EU").
tak = "tak"
ue = "ue"

[files]
# Baselines and the calibration set record answers and passages as given, in Polish too,
# with the PDF's broken words; they are data, not prose.
extend-exclude = ["docs/evals/*-baseline.json", "evals/datasets/calibration.yaml"]
