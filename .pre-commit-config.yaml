# Git hooks: format, lint and type checks before each commit (ADR 0009).
# Tests are deliberately not run here, so a red commit (failing tests) is possible.
# Local hooks only: they use the project's own locked tools, nothing is downloaded.
# Install with `make setup`; run on everything with `uvx pre-commit run --all-files`.

repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format (backend)
        entry: uv run --directory backend ruff format
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false

      - id: ruff-check
        name: ruff check (backend)
        entry: uv run --directory backend ruff check --fix
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false

      - id: mypy
        name: mypy (backend)
        entry: uv run --directory backend mypy
        language: system
        files: ^backend/
        pass_filenames: false

      - id: lint-imports
        name: layer contracts (backend)
        entry: uv run --directory backend lint-imports --no-logo
        language: system
        files: ^backend/
        pass_filenames: false

      - id: prettier
        name: prettier (frontend)
        entry: pnpm --dir frontend exec prettier --write --log-level warn .
        language: system
        files: ^frontend/
        pass_filenames: false

      - id: eslint
        name: eslint (frontend)
        entry: pnpm --dir frontend lint
        language: system
        files: ^frontend/
        pass_filenames: false

      - id: tsc
        name: tsc (frontend)
        entry: pnpm --dir frontend typecheck
        language: system
        files: ^frontend/
        pass_filenames: false
