[project]
name = "assistant-evals"
version = "0.1.0"
description = "Evaluation harness of the Offline Assistant (ADR 0018)"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28,<1",
    "jsonschema>=4.23,<5",
    "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pytest>=9.2",
    "ruff>=0.17",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "PL", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Plain asserts are how pytest expresses expectations.
"tests/**" = ["S101", "PLR2004"]

[tool.mypy]
strict = true
python_version = "3.13"
files = ["harness", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers", "--import-mode=importlib", "-m", "not integration"]
markers = [
    "integration: runs the API, Qdrant and the models; needs make models, make qdrant",
]
