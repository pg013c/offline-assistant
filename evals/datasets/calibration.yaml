- id: cal-35
  source: en-gdpr-principles
  question: Which principles relating to the processing of personal data does the GDPR set out?
  key_points:
  - Lawfulness, fairness and transparency; purpose limitation; data minimisation.
  - Accuracy; storage limitation; integrity and confidentiality.
  - The controller is responsible for compliance and must demonstrate it (accountability).
  answer: The GDPR sets out principles relating to the processing of personal data including lawfulness, fairness
    and transparency, purpose limitation, data minimisation, accuracy, and the requirement to inform data subjects
    about processing operations and their purposes [1, 2].
  passages:
    1: '1. Personal data shall be:

      (a) processed lawfully , fairly and in a transparent manner in relation to the data subject (''lawfulness,
      fairness and transparency'');

      (b) collected for specified, explicit and legitimate purposes and not further processed in a manner that is
      incompatible with those purposes; further processing for archiving purposes in the public interest, scientific
      or historical research purposes or statistical purposes shall, in accordance with Article 89(1), not be considered
      to be incompatible with the initial purposes (''purpose limitation'');

      (c) adequate, relevant and limited to what is necessary in relation to the purposes for which they are processed
      (''data minimisation'');

      (d) accurate and, where necessary , kept up to date; every reasonable step must be taken to ensure that personal
      data that are inaccurate, having regard to the purposes for which they are processed, are erased or rectified
      without delay (''accuracy'');

      ( 1 ) Directive (EU) 2015/1535 of the European Parliament and of the Council of 9 September 2015 laying down
      a procedure for the provision of information in the field of technical regulations and of rules on Information
      Society services (OJ L 241, 17.9.2015, p. 1).'
    2: ( 1 ) Regulation (EC) No 1338/2008 of the European Parliament and of the Council of 16 December 2008 on Community
      statistics on public health and health and safety at work (OJ L 354, 31.12.2008, p. 70). (60) The principles
      of fair and transparent processing require that the data subject be informed of the existence of the processing
      operation and its purposes. The controller should provide the data subject with any further information necessary
      to ensure fair and transparent processing taking into account the specific circumstances and context in which
      the personal data are processed. Furthermore, the data subject should be informed of the existence of profiling
      and the consequences of such profiling. Where the personal data are collected from the data subject, the data
      subject should also be informed whether he or she is obliged to provide the personal data and of the consequences,
      where he or she does not provide such data. That information may be provided in combination with standardised
      icons in order to give in an easily visible, intelligible and clearly legible manner , a meaningful overview
      of the intended processing. Where the icons are presented electronically , they should be machine-readable.
      (61) The information in relation to the processing of personal data relating to the data subject should be
      given to him or her at the time of collection from the data subject, or , where the personal data are obtained
      from another source, within a reasonable period, depending on the circumstances of the case. Where personal
      data can be legitimately disclosed to another recipient, the data subject should be informed when the personal
      data are first disclosed to the recipient. Where the controller intends to process the personal data for a
      purpose other than that for which they were collected, the controller should provide the data subject prior
      to that further processing with information on that other purpose and other necessary information.
  expected:
    correctness: partial
    reason: Lawfulness, purpose limitation, minimisation and accuracy are there; storage limitation, integrity and
      confidentiality, and accountability are not.
    supported:
      1: true
- id: cal-36
  source: pl-ai-transparency
  question: Jakie obowiązki informacyjne mają dostawcy systemów AI wchodzących w interakcję z ludźmi?
  key_points:
  - Dostawcy zapewniają, że osoby fizyczne są informowane o interakcji z systemem AI.
  - Nie dotyczy to sytuacji, w których jest to oczywiste dla rozsądnie poinformowanej osoby.
  answer: Dostawcy systemów AI mają obowiązek informowania osób fizycznych o interakcji z systemem AI, chyba że
    jest to oczywiste z punktu widzenia osoby fizycznej [1]. Obowiązek ten nie dotyczy systemów AI wykorzystywanych
    do celów wykrywania przestępstw itd., z wyjątkiem przypadków, gdy systemy są dostępne dla ogółu społeczeństwa
    [1].
  passages:
    1: 1. Dostawcy zapewniają, aby systemy AI przeznaczone do wchodzenia w bezpośrednią interakcję z osobami fizycznymi
      projektowano i rozwijano w taki sposób, aby zainteresowane osoby fizyczne były informowane o tym, że prowadzą
      interakcję z systemem AI, chyba że jest to oczywiste z punktu widzenia osoby fizycznej, która jest dostatecznie
      poinformowana, uważna i ostrożna, z uwzględnieniem okoliczności i kontekstu wykorzystywania. Obowiązek ten
      nie ma zastosowania do systemów AI, których wykorzystywanie jest dozwolone na mocy prawa do celów wykrywania
      przestępstw , przeciwdziałania im, prowadzenia postępowań przygotowawczych w ich sprawie lub ścigania ich
      sprawców , z zastrzeżeniem odpowiednich zabezpieczeń w zakresie praw i wolności osób trzecich , chyba że systemy
      te udostępnia się ogółowi społeczeństwa na potrzeby składania zawiadomień o popełnieniu przestępstwa.
  expected:
    correctness: correct
    reason: Both points; the second sentence adds the law-enforcement exception, as the passage says.
    supported:
      1: true
      2: true
- id: cal-37
  source: en-gdpr-dpo-tasks
  question: What are the tasks of a data protection officer?
  key_points:
  - To inform and advise the controller, the processor and their employees of their obligations.
  - To monitor compliance with the GDPR and the controller's policies, including training and audits.
  - To advise on data protection impact assessments and to cooperate and act as contact point with the supervisory
    authority.
  answer: The data protection officer's tasks include informing and advising the controller or processor and their
    employees about their obligations [1], monitoring compliance with data protection regulations and internal policies
    [1], providing advice on data protection impact assessments [1], cooperating with the supervisory authority
    [1], and acting as a contact point for the supervisory authority [1]. They must also consider the risks associated
    with processing operations [2].
  passages:
    1: '1. The data protection officer shall have at least the following tasks:

      (a) to inform and advise the controller or the processor and the employees who carry out processing of their
      obligations pursuant to this Regulation and to other Union or Member State data protection provisions;

      (b) to monitor compliance with this Regulation, with other Union or Member State data protection provisions
      and with the policies of the controller or processor in relation to the protection of personal data, including
      the assignment of responsibilities, awareness-raising and training of staff involved in processing operations,
      and the related audits;

      (c) to provide advice where requested as regards the data protection impact assessment and monitor its performance
      pursuant to Article 35;

      (d) to cooperate with the supervisory authority;

      (e) to act as the contact point for the supervisory authority on issues relating to processing, including
      the prior consultation referred to in Article 36, and to consult, where appropriate, with regard to any other
      matter .'
    2: 2. The data protection officer shall in the performance of his or her tasks have due regard to the risk associated
      with processing operations, taking into account the nature, scope, context and purposes of processing.
  expected:
    correctness: correct
    reason: All three points; training and audits are examples and may be missing.
    supported:
      1: true
      2: true
- id: cal-38
  source: cmp-pl-breach-and-incident
  question: Porównaj termin zgłoszenia naruszenia ochrony danych z art. 33 RODO z terminem zgłoszenia poważnego
    incydentu z art. 73 aktu o AI.
  key_points:
  - Naruszenie ochrony danych zgłasza się w miarę możliwości w ciągu 72 godzin.
  - Poważny incydent zgłasza się nie później niż w ciągu 15 dni, a w niektórych przypadkach w ciągu 2 lub 10 dni.
  answer: Termin zgłoszenia naruszenia ochrony danych osobowych z art. 33 RODO wynosi 72 godziny od stwierdzenia
    naruszenia [6], podczas gdy termin zgłoszenia poważnego incydentu z art. 73 aktu o AI wynosi 15 dni od dnia,
    w którym dostawca dowiedział się o incydencie [1]. W przypadku śmierci osoby termin ten skraca się do 10 dni
    [2], a w przypadku powszechnego naruszenia lub incydentu zdefiniowanego w art. 3 pkt 49 lit. b) – do 2 dni [3].
  passages:
    1: '2. Zgłoszenia, o którym mowa w ust. 1, dokonuje się natychmiast po ustaleniu przez dostawcę związku przyczynowego
      między systemem AI a poważnym incydentem lub dostatecznie wysokiego prawdopodobieństwa wystąpienia takiego
      związku, nie później jednak niż w terminie 15 dni od dnia, w którym dostawca lub, w stosownych przypadkach,
      podmiot stosujący dowiedzieli się o wystąpieniu poważnego incydentu.

      Termin na dokonanie zgłoszenia, o którym mowa w akapicie pierwszym, uwzględnia dotkliwość danego poważnego
      incydentu.'
    2: 4. Niezależnie od ust. 2 w przypadku gdy nastąpi śmierć osoby , zgłoszenia dokonuje się natychmiast po stwierdzeniu
      przez dostawcę lub podmiot stosujący wystąpienia lub podejrzenia wystąpienia związku przyczynowego między
      systemem AI wysokiego ryzyka a poważnym incydentem, nie później jednak niż w terminie 10 dni od dnia, w którym
      dostawca lub, w stosownych przypadkach, podmiot stosujący AI dowiedzieli się o wystąpieniu danego poważnego
      incydentu.
    3: 3. Niezależnie od ust. 2 niniejszego artykułu w przypadku powszechnego naruszenia lub poważnego incydentu
      zdefiniowanego w art. 3 pkt 49 lit. b) zgłoszenia, o którym mowa w ust. 1 niniejszego artykułu, dokonuje się
      natychmiast, nie później jednak niż w terminie dwóch dni od dnia, w którym dostawca lub, w stosownych przypadkach,
      podmiot stosujący dowiedzieli się o wystąpieniu tego incydentu.
    6: 1. W przypadku naruszenia ochrony danych osobowych, administrator bez zbędnej zwłoki – w miarę możliwości,
      nie później niż w terminie 72 godzin po stwierdzeniu naruszenia – zgłasza je organowi nadzorczemu właściwemu
      zgodnie z art. 55, chyba że jest mało prawdopodobne, by naruszenie to skutkowało ryzykiem naruszenia praw
      lub wolności osób fizycznych. Do zgłoszenia przekazanego organowi nadzorczemu po upływie 72 godzin dołącza
      się wyjaśnienie przyczyn opóźnienia.
  expected:
    correctness: correct
    reason: 72 hours, 15 days, and 10 and 2 days for the special cases.
    supported:
      1: true
      2: true
