- id: cal-48
  source: span-access-and-rectification
  constructed: The rectification sentence gets a deadline the passage does not set, and loses completion.
  question: Which rights does a data subject have to access and to rectify personal data?
  key_points:
  - The data subject can obtain confirmation of processing, access to the data, and information such as purposes
    and recipients.
  - The data subject can obtain a copy of the data.
  - The data subject can have inaccurate data rectified without undue delay, and incomplete data completed.
  answer: A data subject has the right to access personal data and obtain information about its processing, including
    the purposes of processing, categories of data, recipients, and storage periods [1]. They can have inaccurate
    data rectified within one month [2].
  passages:
    1: '1. The data subject shall have the right to obtain from the controller confirmation as to whether or not
      personal data concer ning him or her are being processed, and, where that is the case, access to the personal
      data and the following information:

      (a) the purposes of the processing;

      (b) the categories of personal data concerned;

      (c) the recipients or categories of recipient to whom the personal data have been or will be disclosed, in
      particular recipients in third countries or international organisations;

      (d) where possible, the envisaged period for which the personal data will be stored, or , if not possible,
      the criteria used to determine that period;

      (e) the existence of the right to request from the controller rectification or erasure of personal data or
      restriction of processing of personal data concerning the data subject or to object to such processing;

      (f) the right to lodge a complaint with a supervisory authority;

      (g) where the personal data are not collected from the data subject, any available information as to their
      source;

      (h) the existence of automated decision-making, including profiling, referred to in Article 22(1) and (4)
      and, at least in those cases, meaningful information about the logic involved, as well as the significance
      and the envisaged consequences of such processing for the data subject.'
    2: The data subject shall have the right to obtain from the controller without undue delay the rectification
      of inaccurate personal data concerning him or her . Taking into account the purposes of the processing, the
      data subject shall have the r ight to have incomplete personal data completed, including by means of providing
      a supplementary statement.
  expected:
    correctness: partial
    reason: Access with its information is there; the copy is not, and rectification gets a wrong deadline instead
      of 'without undue delay' and completion.
    supported:
      1: true
      2: false
