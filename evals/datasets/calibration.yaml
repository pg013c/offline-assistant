  source: ref-article-50
  constructed: The answer gives a registration duty that Article 50 does not contain.
  question: What does Article 50 of the AI Act require?
  key_points:
  - Providers must inform people that they are interacting with an AI system.
  - Synthetic audio, image, video or text output must be marked as artificially generated.
  - Deployers must disclose deep fakes and inform people exposed to emotion recognition or biometric categorisation.
  answer: Article 50 of the AI Act requires providers of high-risk AI systems to register them in the EU database
    before placing them on the market [1].
  passages:
    1: 2. Providers of AI systems, including general-purpose AI systems, generating synthetic audio, image, video
      or text content, shall ensure that the outputs of the AI system are marked in a machine-readable format and
      detectable as ar tificially generated or manipulated. Providers shall ensure their technical solutions are
      effective, interoperable, robust and reliable as far as this is technically feasible, taking into account
      the specificities and limitations of various types of content, the costs of implementation and the generally
      acknowledged state of the art, as may be reflected in relevant technical standards. This obligation shall
      not apply to the extent the AI systems perform an assistive function for standard editing or do not substantially
      alter the input data provided by the deployer or the semantics thereof, or where authorised by law to detect
      , prevent, investigate or prosecute criminal offences.
  expected:
    correctness: wrong
    reason: Registration is not in Article 50; none of the key points is made.
