  source: en-gdpr-erasure
  constructed: The answer describes data portability while citing the erasure article.
  question: When does a data subject have the right to have personal data erased?
  key_points:
  - The data subject can obtain erasure without undue delay where one of the listed grounds applies.
  - Grounds include data no longer necessary, withdrawn consent with no other legal ground, and a justified objection.
  - Grounds also include unlawful processing and a legal obligation to erase.
  answer: A data subject has the right to receive their personal data in a structured, commonly used and machine-readable
    format and to transmit them to another controller [1].
  passages:
    1: '1. The data subject shall have the right to obtain from the controller the erasure of personal data concerning
      him or her without undue delay and the controller shall have the obligation to erase personal data without
      undue delay where one of the following grounds applies:

      (a) the personal data are no longer necessary in relation to the purposes for which they were collected or
      otherwise processed;

      (b) the data subject withdraws consent on which the processing is based according to point (a) of Article
      6(1), or point (a) of Article 9(2), and where there is no other legal ground for the processing;

      (c) the data subject objects to the processing pursuant to Article 21(1) and there are no overriding legitimate
      grounds for the processing, or the data subject objects to the processing pursuant to Article 21(2);

      (d) the personal data have been unlawfully processed;

      (e) the personal data have to be erased for compliance with a legal obligation in Union or Member State law
      to which the controller is subject;

      (f) the personal data have been collected in relation to the offer of information society services referred
      to in Article 8(1).'
  expected:
    correctness: wrong
    reason: Describes portability, not erasure; none of the key points is made.
    supported:
      1: false
