  source: pl-ai-serious-incident
  question: Kiedy dostawca systemu AI wysokiego ryzyka musi zgłosić poważny incydent?
  key_points:
  - Dostawca zgłasza poważny incydent organom nadzoru rynku państwa, w którym incydent wystąpił.
  - Zgłoszenie następuje niezwłocznie po ustaleniu związku przyczynowego, nie później niż 15 dni od powzięcia
    wiadomości.
  answer: Dostawca systemu AI wysokiego ryzyka musi zgłosić poważny incydent natychmiast po ustaleniu
    związku przyczynowego między systemem AI a incydentem, nie później jednak niż w terminie 15 dni od
    dnia, w którym dowiedział się o wystąpieniu incydentu [1]. W przypadku śmierci osoby, zgłoszenie musi
    być dokonane natychmiast, nie później niż w terminie 10 dni od dnia, w którym dowiedział się o incydencie
    [2].
  passages:
    1: '2. Zgłoszenia, o którym mowa w ust. 1, dokonuje się natychmiast po ustaleniu przez dostawcę związku
      przyczynowego między systemem AI a poważnym incydentem lub dostatecznie wysokiego prawdopodobieństwa
      wystąpienia takiego związku, nie później jednak niż w terminie 15 dni od dnia, w którym dostawca
      lub, w stosownych przypadkach, podmiot stosujący dowiedzieli się o wystąpieniu poważnego incydentu.

      Termin na dokonanie zgłoszenia, o którym mowa w akapicie pierwszym, uwzględnia dotkliwość danego
      poważnego incydentu.'
    2: 4. Niezależnie od ust. 2 w przypadku gdy nastąpi śmierć osoby , zgłoszenia dokonuje się natychmiast
      po stwierdzeniu przez dostawcę lub podmiot stosujący wystąpienia lub podejrzenia wystąpienia związku
      przyczynowego między systemem AI wysokiego ryzyka a poważnym incydentem, nie później jednak niż
      w terminie 10 dni od dnia, w którym dostawca lub, w stosownych przypadkach, podmiot stosujący AI
