  source: en-ai-prohibited-practices
  question: Which AI practices are prohibited, such as systems that exploit the vulnerabilities of people?
  key_points:
  - Manipulative or deceptive techniques that materially distort behaviour are prohibited.
  - Exploiting vulnerabilities due to age, disability or a social or economic situation is prohibited.
  - Social scoring and predicting crime solely from profiling are among the prohibited practices.
  answer: AI practices that exploit the vulnerabilities of people are prohibited, including systems that
    use manipulative or deceptive techniques to distort behaviour, particularly those that cause significant
    harm [1, 2]. This includes exploiting vulnerabilities due to age, disability, or specific social or
    economic situations [1, 2].
  passages:
    1: '1. The following AI practices shall be prohibited: (a) the placing on the market, the putting
      into service or the use of an AI system that deploys subliminal techniques beyond a person''s consciousness
      or purposefully manipulative or deceptive techniques, with the objective, or the effect of materially
      distorting the behaviour of a person or a group of persons by appreciably impairing their ability
      to make an informed decision, thereby causing them to take a decision that they would not have otherwise
      taken in a manner that causes or is reasonably likely to cause that person, another person or group
      of persons significant harm; (b) the placing on the market, the putting into service or the use
      of an AI system that exploits any of the vulnerabilities of a natural person or a specific group
      of persons due to their age, disability or a specific social or economic situation, with the objective,
      or the effect, of materially distorting the behaviour of that person or a person belonging to that
      group in a manner that causes or is reasonably likely to cause that person or another person significant
      harm; (c) the placing on the market, the putting into service or the use of AI systems for the evaluation
      or classification of natural persons or groups of persons over a certain period of time based on
      their social behaviour or known, inferred or predicted personal or personality characteristics ,
      with the social score leading to either or both of the following: (i) detrimental or unfavourable
      treatment of certain natural persons or groups of persons in social contexts that are unrelated
      to the contexts in which the data was originally generated or collected; (ii) detrimental or unfavourable
      treatment of certain natural persons or groups of persons that is unjustified or disproportionate
      to their social behaviour or its gravity; (d) the placing on the market, the putting into service
      for this specific purpose, or the use of an AI system for making risk assessments of natural'
    2: (29) AI-enabled manipulative techniques can be used to persuade persons to engage in unwanted behaviours,
      or to deceive them by nudging them into decisions in a way that subverts and impairs their autonomy
      , decision-making and free choices. The placing on the market, the putting into service or the use
      of certain AI systems with the objective to or the effect of materially distorting human behaviour
      , whereby significant harms, in particular having sufficiently important adverse impacts on physical,
      psychological health or financial interests are likely to occur , are particularly dangerous and
      should therefore be prohibited. Such AI systems deploy subliminal components such as audio, image,
      video stimuli that persons cannot perceive, as those stimuli are beyond human perception, or other
      manipulative or deceptive techniques that subvert or impair person's autonomy , decision-making
      or free choice in ways that people are not consciously aware of those techniques or , where they
      are aware of them, can still be deceived or are not able to control or resist them. This could be
      facilitated, for example, by machine-brain interfaces or virtual reality as they allow for a higher
      degree of control of what stimuli are presented to persons, insofar as they ma y materially distort
      their behaviour in a significantly harmful manner . In addition, AI systems may also otherwise exploit
      the vulnerabilities of a person or a specific group of persons due to their age , disability within
      the meaning of Directive (EU) 2019/882 of the European Parliament and of the Council ( 16 ), or
      a specific social or economic situation that is likely to make those persons more vulnerable to
      exploitation such as persons living in extreme poverty , ethnic or religious minorities.
  expected:
    correctness: partial
    reason: Manipulation and vulnerabilities are there; social scoring and crime prediction are not.
    supported:
      1: true
      2: true
