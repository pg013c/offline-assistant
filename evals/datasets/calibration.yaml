- id: cal-13
  source: ref-article-83
  question: What does Article 83 of the GDPR set out?
  key_points:
  - Administrative fines must be effective, proportionate and dissuasive.
  - When deciding a fine, the nature, gravity and duration of the infringement and other listed factors
    are considered.
  - Fines reach up to EUR 10 million or 2 %, or up to EUR 20 million or 4 % of turnover, depending on
    the infringement.
  answer: Article 83 sets out the general conditions for imposing administrative fines, including that
    they must be effective, proportionate, and dissuasive [6]. It outlines factors considered when determining
    the fine, such as the nature and gravity of the infringement, the controller's responsibility, and
    cooperation with supervisory authorities [7]. Fines can reach up to 20 million EUR or 4% of annual
    turnover for certain violations [10].
  passages:
    6: 1. Each supervisory authority shall ensure that the imposition of administrative fines pursuant
      to this Article in respect of infringements of this Regulation referred to in paragraphs 4, 5 and
      6 shall in each individual case be effective, proportionate and dissuasive.
    7: '2. Administrative fines shall, depending on the circumstances of each individual case, be imposed
      in addition to, or instead of, measures referred to in points (a) to (h) and (j) of Article 58(2).
      When deciding whether to impose an administrative fine and deciding on the amount of the administrative
      fine in each individual case due regard shall be given to the following:

      (a) the nature, gravity and duration of the infringement taking into account the nature scope or
      purpose of the processing concerned as well as the number of data subjects affected and the level
      of damage suffered by them;

      (b) the intentional or negligent character of the infringement;

      (c) any action taken by the controller or processor to mitigate the damage suffered by data subjects;

      (d) the degree of responsibility of the controller or processor taking into account technical and
      organisational measures implemented by them pursuant to Articles 25 and 32;

      (e) any relevant previous infringements by the controller or processor;

      (f) the degree of cooperation with the supervisory authority , in order to remedy the infringement
      and mitigate the possible adverse effects of the infringement;

      (g) the categories of personal data affected by the infringement;

      (h) the manner in which the infringement became known to the supervisory authority , in particular
      whether , and if so to what extent, the controller or processor notified the infringement;

      (i) where measures referred to in Article 58(2) have previously been ordered against the controller
      or processor concer ned with regard to the same subject-matter , compliance with those measures;

      (j) adherence to approved codes of conduct pursuant to Article 40 or approved certification mechanisms
      pursuant to Article 42; and

      (k) any other aggravating or mitigating factor applicable to the circumstances of the case, such
      as financial benefits gained, or losses avoided, directly or indirectly , from the infringement.'
    10: '5. Infringements of the following provisions shall, in accordance with paragraph 2, be subject
      to administrative fines up to 20 000 000 EUR, or in the case of an undertaking, up to 4 % of the
      total worldwide annual turnover of the preceding financial year , whichever is higher:

      (a) the basic principles for processing, including conditions for consent, pursuant to Articles
      5, 6, 7 and 9;

      (b) the data subjects'' rights pursuant to Articles 12 to 22;

      (c) the transfers of personal data to a recipient in a third country or an international organisation
      pursuant to Articles 44 to 49;

      (d) any obligations pursuant to Member State law adopted under Chapter IX;

      (e) non-compliance with an order or a temporary or definitive limitation on processing or the suspension
      of data flows by the supervisory authority pursuant to Article 58(2) or failure to provide access
      in violation of Article 58(1).'
  expected:
    correctness: partial
    reason: Effectiveness and factors are right; only the EUR 20 million tier is given, not EUR 10 million
      or 2 %.
    supported:
      1: true
      2: true
      3: true
