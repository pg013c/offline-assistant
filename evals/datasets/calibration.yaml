  source: pl-gdpr-erasure-exceptions
  question: Kiedy prawo do usunięcia danych nie ma zastosowania?
  key_points:
  - Gdy przetwarzanie jest niezbędne do korzystania z wolności wypowiedzi i informacji.
  - Gdy jest niezbędne do wywiązania się z obowiązku prawnego lub zadania w interesie publicznym, także
    w dziedzinie zdrowia publicznego.
  - Gdy służy celom archiwalnym, naukowym lub statystycznym albo ustaleniu, dochodzeniu lub obronie roszczeń.
  answer: Prawo do usunięcia danych nie ma zastosowania, gdy przetwarzanie jest niezbędne do korzystania
    z prawa do wolności wypowiedzi i informacji [1], do wywiązania się z prawnego obowiązku wymagającego
    przetwarzania [1], do wykonania zadania realizowanego w interesie publicznym [1], z uwagi na względy
    interesu publicznego w dziedzinie zdrowia publicznego [1], do celów archiwalnych, naukowych, historycznych
    lub statystycznych [1], oraz do ustalenia, dochodzenia lub obrony roszczeń [1].
  passages:
    1: '3. Ust. 1 i 2 nie mają zastosowania, w zakresie w jakim przetwarzanie jest niezbędne:

      a) do korzystania z prawa do wolności wypowiedzi i informacji;

      b) do wywiązania się z prawnego obowiązku wymagającego przetwarzania na mocy prawa Unii lub prawa
      państwa członkowskiego, któremu podlega administrator , lub do wykonania zadania realizowanego w
      interesie publicznym lub w ramach sprawowania władzy publicznej powierzonej administratorowi;

      c) z uwagi na względy interesu publicznego w dziedzinie zdrowia publicznego zgodnie z art. 9 ust.
      2 lit. h) oraz i) i art. 9 ust. 3;

      d) do celów archiwalnych w interesie publicznym, do celów badań naukowych lub historycznych lub
      do celów statystycznych zgodnie z art. 89 ust. 1, o ile prawdopodobne jest, że prawo, o którym mowa
      w ust. 1, uniemożliwi lub poważnie utrudni realizację celów takiego przetwarzania; lub

      e) do ustalenia, dochodzenia lub obrony roszczeń.'
  expected:
    correctness: correct
    reason: Lists every exception of Art. 17(3).
    supported:
      1: true
- id: cal-18
  source: en-ai-human-oversight
  question: What does the AI Act require for human oversight of high-risk AI systems?
  key_points:
  - High-risk AI systems are designed so that natural persons can effectively oversee them while in use.
  - Oversight aims to prevent or minimise risks to health, safety or fundamental rights.
  - Overseers must be able to understand, interpret and override the output, or stop the system.
  answer: The AI Act requires human oversight for high-risk AI systems to prevent or minimize risks to
    health, safety, and fundamental rights [3]. This includes enabling natural persons to understand the
    system's capabilities and limitations, monitor its operation, avoid automation bias, interpret its
    outputs, and intervene if necessary [2].
  passages:
    3: 2. Human oversight shall aim to prevent or minimise the risks to health, safety or fundamental
      rights that may emerge when a high-risk AI system is used in accordance with its intended purpose
      or under conditions of reasonably foreseeable misuse, in particular where such risks persist despite
      the application of other requirements set out in this Section.
    2: '4. For the purpose of implementing paragraphs 1, 2 and 3, the high-risk AI system shall be provided
      to the deployer in suc h a way that natural persons to whom human oversight is assigned are enabled,
      as appropriate and proportionate:

      (a) to properly understand the relevant capacities and limitations of the high-risk AI system and
      be able to duly monitor its operation, including in view of detecting and addressing anomalies,
      dysfunctions and unexpected performance;

      (b) to remain aware of the possible tendency of automatically relying or over-relying on the output
      produced by a high-risk AI system (automation bias), in particular for high-risk AI systems used
      to provide information or recommendations for decisions to be taken by natural persons;

      (c) to correctly interpret the high-risk AI system''s output, taking into account, for example,
      the interpretation tools and methods available;

      (d) to decide, in any particular situation, not to use the high-risk AI system or to otherwise disregard,
      override or reverse the output of the high-risk AI system;

      (e) to intervene in the operation of the high-risk AI system or interrupt the system through a ''stop''
      button or a similar procedure that allows the system to come to a halt in a safe state.'
  expected:
    correctness: correct
    reason: Makes all three key points.
    supported:
      1: true
      2: true
