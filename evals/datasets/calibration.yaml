  source: en-gdpr-erasure
  question: When does a data subject have the right to have personal data erased?
  key_points:
  - The data subject can obtain erasure without undue delay where one of the listed grounds applies.
  - Grounds include data no longer necessary, withdrawn consent with no other legal ground, and a justified objection.
  - Grounds also include unlawful processing and a legal obligation to erase.
  answer: A data subject has the right to have personal data erased when the data are no longer necessary for the
    purposes they were collected or processed [1], or when the data subject withdraws consent and there is no other
    legal basis for processing [1], or when the data subject objects to processing and there are no overriding legitimate
    grounds [1], or when the data were unlawfully processed [1], or for compliance with a legal obligation [1],
    or when the data were collected in relation to information society services [1].
  passages:
    1: '1. The data subject shall have the right to obtain from the controller the erasure of personal data concerning
      him or her without undue delay and the controller shall have the obligation to erase personal data without
      undue delay where one of the following grounds applies:

      (a) the personal data are no longer necessary in relation to the purposes for which they were collected or
      otherwise processed;

      (b) the data subject withdraws consent on which the processing is based according to point (a) of Article
      6(1), or point (a) of Article 9(2), and where there is no other legal ground for the processing;

      (c) the data subject objects to the processing pursuant to Article 21(1) and there are no overriding legitimate
      grounds for the processing, or the data subject objects to the processing pursuant to Article 21(2);

      (d) the personal data have been unlawfully processed;

      (e) the personal data have to be erased for compliance with a legal obligation in Union or Member State law
      to which the controller is subject;

      (f) the personal data have been collected in relation to the offer of information society services referred
      to in Article 8(1).'
  expected:
    correctness: correct
    reason: Erasure when a ground applies, with all grounds listed; 'without undue delay' is missing but is a qualifier.
    supported:
      1: true
- id: cal-24
  source: en-gdpr-dpo
  question: When must a controller designate a data protection officer?
  key_points:
  - When processing is carried out by a public authority or body, except courts in their judicial capacity.
  - When core activities require regular and systematic monitoring of data subjects on a large scale.
  - When core activities consist of large-scale processing of special categories of data or data on criminal convictions.
  answer: A controller must designate a data protection officer if the processing is carried out by a public authority
    or body, or if their core activities involve large-scale processing of special categories of data or personal
    data relating to criminal convictions and offences [1].
  passages:
    1: '1. The controller and the processor shall designate a data protection officer in any case where:

      (a) the processing is carried out by a public authority or body , except for courts acting in their judicial
      capacity;

      (b) the core activities of the controller or the processor consist of processing operations which, by virtue
      of their nature, their scope and/or their purposes, require regular and systematic monitoring of data subjects
      on a large scale; or

      (c) the core activities of the controller or the processor consist of processing on a large scale of special
      categories of data pursuant to Article 9 and personal data relating to criminal convictions and offences referred
      to in Article 10.'
  expected:
    correctness: partial
    reason: Public authorities and special-category data are there; regular and systematic monitoring on a large
      scale is not.
    supported:
      1: true
- id: cal-25
  source: pl-ai-deployer-duties
  question: Jakie obowiązki mają podmioty stosujące systemy AI wysokiego ryzyka?
  key_points:
  - Podmioty stosujące stosują system zgodnie z instrukcją obsługi, podejmując odpowiednie środki techniczne i organizacyjne.
  - Powierzają nadzór ze strony człowieka osobom z odpowiednimi kompetencjami, przeszkoleniem i uprawnieniami.
  - W zakresie, w jakim kontrolują dane wejściowe, zapewniają ich adekwatność i reprezentatywność.
  answer: Podmioty stosujące systemy AI wysokiego ryzyka mają obowiązek monitorowania działania systemu AI na podstawie
    instrukcji obsługi i informowania dostawców oraz odpowiednich organów nadzoru w przypadku podejrzewania ryzyka
    lub wystąpienia incydentów [1]. Ponadto, są zobowiązane do podejmowania środków technicznych i organizacyjnych,
    aby systemy były wykorzystywane zgodnie z instrukcją obsługi [3].
  passages:
    1: '5. Podmioty stosujące monitorują działanie systemu AI wysokiego ryzyka w oparciu o instrukcję obsługi i
      w stosownych przypadkach informują dostawców zgodnie z art. 72. W przypadku gdy podmioty stosujące mają powody
      uważać, że wykorzystanie systemu AI wysokiego ryzyka zgodnie z instrukcją obsługi może powodować, że ten system
      AI będzie stwarzał ryzyko w rozumieniu art. 79 ust. 1, bez zbędnej zwłoki informują o tym dostawcę lub dystrybutora
      oraz odpowiedni organ nadzoru rynku i zawieszają wykorzystywanie systemu. W przypadku gdy podmioty stosujące
      stwierdziły wystąpienie poważnego incydentu, natychmiast informują o tym incydencie najpierw dostawcę, a następnie
      importera lub dystrybutora oraz odpowiednie organy nadzoru rynku. Jeżeli podmiot stosujący nie jest w stanie
      skontaktować się z dostawcą, art. 73 stosuje się odpowiednio. Obowiązek ten nie obejmuje wrażliwych danych
      operacyjnych podmiotów stosujących systemy AI będących organami ścigania.

      W odniesieniu do podmiotów stosujących będących instytucjami finansowymi, które podlegają wymogom dotyczącym
      ich systemu zarządzania wewnętrznego, uzgodnień lub procedur na podstawie przepisów prawa Unii dotyczących
      usług finansowych, obowiązek w zakresie monitorowania, o którym mowa w akapicie pierwszym, uznaje się za spełniony
      w przypadku zapewnienia zgodności z przepisami dotyczącymi uzgodnień, procedur i mechanizmów zarządzania wewnętrznego
      na podstawie odpowiednich przepisów dotyczących usług finansowych .'
    3: 1. Podmioty stosujące systemy AI wysokiego ryzyka podejmują – na podstawie ust. 3 i 6 – odpowiednie środki
      techniczne i organizacyjne w celu zapewnienia, aby systemy takie były wykorzystywane zgodnie z dołączoną do
      nich instrukcją obsługi.
  expected:
    correctness: partial
    reason: Use according to the instructions is there; human oversight and input data are not.
    supported:
      1: true
      2: true
- id: cal-26
  source: pl-gdpr-access
  question: Do jakich informacji o przetwarzaniu swoich danych ma dostęp osoba, której dane dotyczą?
  key_points:
  - Osoba może uzyskać potwierdzenie, czy jej dane są przetwarzane, i dostęp do nich.
  - Ma prawo do informacji m.in. o celach przetwarzania, kategoriach danych, odbiorcach i okresie przechowywania.
  - Ma prawo do kopii danych.
  answer: Osoba, której dane dotyczą, ma dostęp do informacji o celach przetwarzania, kategoriach danych, odbiorcach
    danych, planowanym okresie przechowywania danych, prawie do żądania sprostowania, usunięcia lub ograniczenia
    przetwarzania, prawie do wniesienia skargi do organu nadzorczego, źródle danych oraz zautomatyzowanym decyzjach
    dotyczących jej danych [1, 2, 3].
  passages:
    1: '1. Osoba, której dane dotyczą, jest uprawniona do uzyskania od administratora potwierdzenia, czy przetwarzane
      są dane osobowe jej dotyczące, a jeżeli ma to miejsce, jest uprawniona do uzyskania dostępu do nich oraz następujących
      informacji:

      a) cele przetwarzania;

      b) kategorie odnośnych danych osobowych;

      c) informacje o odbiorcach lub kategoriach odbiorców , którym dane osobowe zostały lub zostaną ujawnione,
      w szczególności o odbiorcach w państwach trzecich lub organizacjach międzynarodowych;

      d) w miarę możliwości planowany okres przechowywania danych osobowych, a gdy nie jest to możliwe, kryteria
      ustalania tego okresu;

      e) informacje o prawie do żądania od administratora sprostowania, usunięcia lub ograniczenia przetwarzania
      danych osobowych dotyczącego osoby , której dane dotyczą, oraz do wniesienia sprzeciwu wobec takiego przetwarzania;

      f) informacje o prawie wniesienia skargi do organu nadzorczego;

      g) jeżeli dane osobowe nie zostały zebrane od osoby , której dane dotyczą – wszelkie dostępne informacje o
      ich źródle;

      h) informacje o zautomatyzowanym podejmowaniu decyzji, w tym o profilowaniu, o którym mowa w art. 22 ust.
      1 i 4, oraz – przynajmniej w tych przypadkach – istotne informacje o zasadach ich podejmowania, a także o
      znaczeniu i przewidywanych konsekwencjach takiego przetwarzania dla osoby , której dane dotyczą.'
    2: (62) Nałożenie obowiązku udzielenia informacji nie jest jednak konieczne, jeżeli osoba, której dane dotyczą,
      dysponuje już tymi informacjami, jeżeli utrwalenie lub ujawnienie danych są wyraźnie przewidziane prawem,
      lub jeżeli poinformowanie osoby , której dane dotyczą, okazuje się niemożliwe lub wymagałoby niewspółmiernie
      dużego wysiłku. Sytuacja braku możliwości lub niewspółmiernie dużego wysiłku może zachodzić w szczególności
      przypadku, gdy przetwarzanie służy celom archiwalnym w interesie publicznym, celom badań naukowych lub historycznych
      lub celom statystycznym. Uwzględnić przy tym należy liczbę osób, których dane dotyczą, okres przechowywania
      danych oraz wszelkie przyjęte odpowiednie zabezpieczenia. (63) Każda osoba fizyczna powinna mieć prawo dostępu
      do zebranych danych jej dotyczących oraz powinna mieć możliwość łatwego wykonywania tego prawa w rozsądnych
      odstępach czasu, by mieć świadomość przetwarzania i móc zweryfikować zgodność przetwarzania z prawem. Obejmuje
      to prawo dostępu osób, których dane dotyczą, do danych dotyczących ich zdrowia, na przykład do danych w dokumentacji
      medycznej zawierającej takie informacje, jak diagnoza, wyniki badań, oceny dokonywane przez lekarzy prowadzących,
      stosowane terapie czy przeprowadzone zabiegi. Dlatego też każda osoba, której dane dotyczą, powinna mieć prawo
      do wiedzy i informacji, w szczególności w zakresie celów , w jakich dane osobowe są przetwarzane, w miarę
      możliwości okresu, przez jaki dane osobowe są przetwarzane, odbiorców danych osobowych, założeń ewentualnego
      zautomatyzowanego przetwarzania danych osobowych oraz, przynajmniej w przypadku profilowania, konsekwencji
      takiego przetwarzania. W miarę możliwości administrator powinien mieć możliwość udzielania zdalnego dostępu
      do bezpiecznego systemu, który zapewni osobie, której dane dotyczą, bezpośredni dostęp do jej danych osobowych.
    3: 'PL

      (60) Zasady rzetelnego i przejrzystego przetwarzania wymagają, by osoba, której dane dotyczą, była informowana
      o prowadzeniu operacji przetwarzania i o jej celach. Administrator powinien podać osobie, której dane dotyczą,
      wszelkie inne informacje niezbędne do zapewnienia rzetelności i przejrzystości przetwarzania, uwzględniając
      konkretne okoliczności i konkretny kontekst przetwarzania danych osobowych. Ponadto należy poinformować osobę,
      której dane dotyczą, o fakcie profilowania oraz o konsekwencjach takiego profilowania. Jeżeli gromadzi się
      dane osobowe od osoby , której dane dotyczą, należy ją też poinformować, czy ma ona obowiązek je podać, oraz
      o konsekwencjach ich niepodania. Informacje te można przekazać w połączeniu ze standardowymi znakami graficznymi,
      które w widoczny , zrozumiały i czytelny sposób przedstawią sens zamierzonego przetwarzania. Jeżeli znaki
      te są przedstawione elektronicznie, powinny nadawać się do odczytu maszynowego. (61) Informacje o przetwarzaniu
      danych osobowych dotyczących osoby , której dane dotyczą, należy przekazać tej osobie w momencie zbierania
      danych, a jeżeli danych nie uzyskuje się od osoby , której dane dotyczą, lecz z innego źródła – w rozsądnym
      terminie, zależnie od okoliczności. Jeżeli dane osobowe można zgodnie z prawem ujawnić innemu odbiorcy , należy
      poinformować o tym osobę, której dane dotyczą, w momencie pierwszorazowego ujawnienia danych temu odbiorcy
      . Jeżeli administrator planuje przetwarzać dane osobowe w celu innym niż cel, w których dane osobowe zostały
      zebrane, powinien on przed takim dalszym przetwarzaniem poinformować osobę, której dane dotyczą, o tym innym
      celu oraz dostarczyć jej innych niezbędnych informacji. Jeżeli osobie, której dane dotyczą, nie można podać
      pochodzenia danych osobowych, ponieważ korzystano z różnych źródeł, informacje należy przedstawić w sposób
      ogólny .'
  expected:
    correctness: partial
    reason: Lists the information, but not the confirmation of processing, access to the data itself, or the copy.
    supported:
      1: true
- id: cal-27
  source: pl-gdpr-portability
  question: Na czym polega prawo do przenoszenia danych?
  key_points:
  - Osoba może otrzymać dostarczone przez siebie dane w ustrukturyzowanym, powszechnie używanym formacie do odczytu
    maszynowego.
  - Może przesłać je innemu administratorowi.
  - Dotyczy to przetwarzania na podstawie zgody lub umowy, w sposób zautomatyzowany.
  answer: Prawo do przenoszenia danych polega na otrzymaniu danych osobowych w ustrukturyzowanym, powszechnie używanym
    formacie nadającym się do odczytu maszynowego oraz na ich przesłaniu innemu administratorowi, o ile jest to
    technicznie możliwe [1, 2, 3].
  passages:
    1: 2. Wykonując prawo do przenoszenia danych na mocy ust. 1, osoba, której dane dotyczą, ma prawo żądania, by
      dane osobowe zostały przesłane przez administratora bezpośrednio innemu administratorowi, o ile jest to technicznie
      możliwe.
    2: '1. Osoba, której dane dotyczą, ma prawo otrzymać w ustrukturyzowanym, powszechnie używanym formacie nadającym
      się do odczytu maszynowego dane osobowe jej dotyczące, które dostarczyła administratorowi, oraz ma prawo przesłać
      te dane osobowe innemu administratorowi bez przeszkód ze strony administratora, któremu dostarczono te dane
      osobowe, jeżeli:

      a) przetwarzanie odbywa się na podstawie zgody w myśl art. 6 ust. 1 lit. a) lub art. 9 ust. 2 lit. a) lub
      na podstawie umowy w myśl art. 6 ust. 1 lit. b); oraz

      b) przetwarzanie odbywa się w sposób zautomatyzowany .'
    3: 2. In exercising his or her right to data portability pursuant to paragraph 1, the data subject shall have
      the right to have the personal data transmitted directly from one controller to another , where technically
      feasible.
  expected:
    correctness: partial
    reason: The format and the transfer to another controller are there; the conditions (consent or contract, automated
      processing) are not.
    supported:
      1: true
- id: cal-28
  source: x-pl-to-en-breach
  question: W jakim terminie administrator zgłasza naruszenie ochrony danych osobowych organowi nadzorczemu?
  key_points:
  - Bez zbędnej zwłoki, w miarę możliwości nie później niż 72 godziny po stwierdzeniu naruszenia.
  - Do późniejszego zgłoszenia dołącza się wyjaśnienie przyczyn opóźnienia.
  answer: Administrator zgłasza naruszenie ochrony danych osobowych organowi nadzorczemu nie później niż w terminie
    72 godzin po stwierdzeniu naruszenia [1, 2].
  passages:
    1: 1. W przypadku naruszenia ochrony danych osobowych, administrator bez zbędnej zwłoki – w miarę możliwości,
      nie później niż w terminie 72 godzin po stwierdzeniu naruszenia – zgłasza je organowi nadzorczemu właściwemu
      zgodnie z art. 55, chyba że jest mało prawdopodobne, by naruszenie to skutkowało ryzykiem naruszenia praw
      lub wolności osób fizycznych. Do zgłoszenia przekazanego organowi nadzorczemu po upływie 72 godzin dołącza
      się wyjaśnienie przyczyn opóźnienia.
    2: społeczne. Dlatego natychmiast po stwierdzeniu naruszenia ochrony danych osobowych administrator powinien
      zgłosić je organowi nadzorczemu bez zbędnej zwłoki, jeżeli to wykonalne, nie później niż w terminie 72 godzin
      po stwierdzeniu naruszenia, chyba że administrator jest w stanie wykazać zgodnie z zasadą rozliczalności,
      że jest mało prawdopodobne , by naruszenie to mogło powodować ryzyko naruszenia praw lub wolności osób fizycznych.
      Jeżeli nie można dokonać zgłoszenia w terminie 72 godzin, zgłoszeniu powinno towarzyszyć wyjaśnienie przyczyn
      opóźnienia, a informacje mogą być przekazywane stopniowo, bez dalszej zbędnej zwłoki. (86) Administrator powinien
      bez zbędnej zwłoki poinformować osobę, której dane dotyczą, o naruszeniu ochrony danych osobowych, jeżeli
      może ono powodować wysokie ryzyko naruszenia praw lub wolności tej osoby , tak aby umożliwić tej sobie podjęcie
      niezbędnych działań zapobiegawczych. Informacja taka powinna zawierać opis c harakteru naruszenia ochrony
      danych osobowych oraz zalecenia dla danej osoby fizycznej co do minimalizacji potencjalnych niekorzystnych
      skutków . Informacje należy przekazywać osobom, których dane dotyczą, tak szybko, jak jest to rozsądnie możliwe,
      w ścisłej współpracy z organem nadzorczym, z poszanowaniem wskazówek przekazanych przez ten organ lub inne
      odpowiednie organy , takie jak organy ścigania. Na przykład potrzeba zminimalizowania bezpośredniego ryzyka
      wystąpienia szkody będzie wymagać niezwłocznego poinformowania osób, których dane dotyczą, natomiast wdrożenie
      odpowiednich środków przeciwko takim samym lub podobnym naruszeniom ochrony danych może uzasadniać późniejsze
      poinformowanie. (87) Należy się upewnić, czy wdrożono wszelkie odpowiednie techniczne środki ochrony i wszelkie
      odpowiednie środki organizacyjne, by od razu stwierdzić naruszenie ochrony danych osobowych i szybko poinformować
      organ nadzorczy i osobę, której dane dotyczą.
  expected:
    correctness: partial
    reason: Gives 72 hours, but not that a later notice must explain the delay.
    supported:
      1: true
- id: cal-29
  source: x-en-to-pl-prohibited
  question: Which AI practices are prohibited under the AI Act?
  key_points:
  - Manipulative or deceptive techniques and exploiting vulnerabilities are prohibited.
  - Social scoring and untargeted scraping of facial images for recognition databases are prohibited.
  - Real-time remote biometric identification in public spaces for law enforcement is prohibited except in narrow
    cases.
  answer: The AI Act prohibits AI practices that use subliminal or manipulative techniques to distort behavior,
    exploit vulnerabilities of individuals or groups, and make social scores leading to unjust treatment [1, 2].
    It also prohibits biometric categorisation systems that infer personal characteristics like political opinions
    or sexual orientation [3].
  passages:
    1: '1. The following AI practices shall be prohibited: (a) the placing on the market, the putting into service
      or the use of an AI system that deploys subliminal techniques beyond a person''s consciousness or purposefully
      manipulative or deceptive techniques, with the objective, or the effect of materially distorting the behaviour
      of a person or a group of persons by appreciably impairing their ability to make an informed decision, thereby
      causing them to take a decision that they would not have otherwise taken in a manner that causes or is reasonably
      likely to cause that person, another person or group of persons significant harm; (b) the placing on the market,
      the putting into service or the use of an AI system that exploits any of the vulnerabilities of a natural
      person or a specific group of persons due to their age, disability or a specific social or economic situation,
      with the objective, or the effect, of materially distorting the behaviour of that person or a person belonging
      to that group in a manner that causes or is reasonably likely to cause that person or another person significant
      harm; (c) the placing on the market, the putting into service or the use of AI systems for the evaluation
      or classification of natural persons or groups of persons over a certain period of time based on their social
      behaviour or known, inferred or predicted personal or personality characteristics , with the social score
      leading to either or both of the following: (i) detrimental or unfavourable treatment of certain natural persons
      or groups of persons in social contexts that are unrelated to the contexts in which the data was originally
      generated or collected; (ii) detrimental or unfavourable treatment of certain natural persons or groups of
      persons that is unjustified or disproportionate to their social behaviour or its gravity; (d) the placing
      on the market, the putting into service for this specific purpose, or the use of an AI system for making risk
      assessments of natural'
    2: '1. Zakazuje się następujących praktyk w zakresie AI: a) wprowadzania do obrotu, oddawania do użytku lub
      wykorzystywania systemu AI, który stosuje techniki podprogowe będące poza świadomością danej osoby lub celowe
      techniki manipulacyjne lub wprowadzające w błąd, czego celem lub skutkiem jest dokonanie znaczącej zmiany
      zachowania danej osoby lub grupy osób poprzez znaczące ograniczenie ich zdolności do podejmowania świadomych
      decyzji, powodując tym samym podjęcie przez nie decyzji, której inaczej by nie podjęły , w sposób, który wyrządza
      lub może wyrządzić u niej, u innej osoby lub u grupy osób poważną szkodę; b) wprowadzania do obrotu, oddawania
      do użytku lub wykorzystywania systemu AI, który wykorzystuje słabości osoby fizycznej lub określonej grupy
      osób ze względu na ich wiek , niepełnosprawność lub szczególną sytuację społeczną lub ekonomiczną, którego
      celem lub skutkiem jest dokonanie znaczącej zmiany zachowania danej osoby lub osoby należącej do tej grupy
      w sposób, który wyrządza lub może z uzasadnionym prawdopodobieństwem wyrządzić u tej osoby lub u innej osoby
      poważną szkodę; c) wprowadzania do obrotu, oddawania do użytku lub wykorzystywania systemów AI na potrzeby
      oceny lub klasyfikacji osób fizycznych lub grup osób prowadzonej przez określony czas na podstawie ich zachowania
      społecznego lub znan ych , wywnioskowanych lub przewidywanych cech osobistych lub cech osobowości, kiedy to
      scoring społeczny prowadzi do jednego lub obu z następujących skutków: (i) krzywdzącego lub niekorzystnego
      traktowania niektórych osób fizycznych lub grup osób w kontekstach społecznych, które nie są związane z kontekstami,
      w których pierwotnie wygenerowano lub zebrano dane; (ii) krzywdzącego lub niekorzystnego traktowania niektórych
      osób fizycznych lub grup osób, które jest nieuzasadnione lub nieproporcjonalne do ich zachowania społecznego
      lub jego wagi; d) wprowadzania do obrotu, oddawania do użytku w tym konkretnym celu lub wykorzystywania systemu
      AI do przeprowadzania ocen'
    3: intention to distort behaviour where the distortion results from factors external to the AI system which
      are outside the control of the provider or the deployer , namely factors that may not be reasonably foreseeable
      and therefore not possible for the provider or the deployer of the AI system to mitigate. In any case, it
      is not necessary for the provider or the deployer to have the intention to cause significant harm, provided
      that such harm results from the manipulative or exploitative AI-enabled practices. The prohibitions for such
      AI practices are complementary to the provisions contained in Directive 2005/29/EC of the European Parliament
      and of the Council ( 17 ), in particular unfair commercial practices leading to economic or financial harms
      to consumers are prohibited under all circumstances, irrespective of whether they are put in place through
      AI systems or otherwise. The prohibitions of manipulative and exploitative practices in this Regulation should
      not affect lawful practices in the context of medical treatment such as psychological treatment of a mental
      disease or physical rehabilitation, when those practices are carried out in accordance with the applicable
      law and medical standards, for example explicit consent of the individuals or their legal representatives.
      In addition, common and legitimate commercial practices, for example in the field of advertising, that comply
      with the applicable law should not, in themselves, be regarded as constituting harmful manipulative AI-enabled
      practices. (30) Biometric categorisation systems that are based on natural persons' biometric data, such as
      an individual person's face or fingerprint, to deduce or infer an individuals ' political opinions, trade
      union membership, religious or philosophical beliefs, race, sex life or sexual orientation should be prohibited.
  expected:
    correctness: partial
    reason: Manipulation and vulnerabilities are there; social scoring without the scraping of facial images, and
      nothing on real-time biometric identification.
    supported:
      1: true
      2: true
- id: cal-30
  source: x-en-to-pl-erasure
  question: What is the right to erasure of personal data?
  key_points:
  - The data subject can have personal data erased without undue delay where one of the listed grounds applies.
  - The controller must erase the data, and inform others who received data it made public.
  answer: The right to erasure, also known as the 'right to be forgotten', allows a data subject to request the
    deletion of their personal data without undue delay, provided certain conditions are met [1]. These conditions
    include situations where the data is no longer necessary for the original purpose, was unlawfully processed,
    or the data subject objects to the processing without overriding legitimate grounds [1].
  passages:
    1: '1. The data subject shall have the right to obtain from the controller the erasure of personal data concerning
      him or her without undue delay and the controller shall have the obligation to erase personal data without
      undue delay where one of the following grounds applies:

      (a) the personal data are no longer necessary in relation to the purposes for which they were collected or
      otherwise processed;

      (b) the data subject withdraws consent on which the processing is based according to point (a) of Article
      6(1), or point (a) of Article 9(2), and where there is no other legal ground for the processing;

      (c) the data subject objects to the processing pursuant to Article 21(1) and there are no overriding legitimate
      grounds for the processing, or the data subject objects to the processing pursuant to Article 21(2);

      (d) the personal data have been unlawfully processed;

      (e) the personal data have to be erased for compliance with a legal obligation in Union or Member State law
      to which the controller is subject;

      (f) the personal data have been collected in relation to the offer of information society services referred
      to in Article 8(1).'
  expected:
    correctness: partial
    reason: The right and its grounds are there; the controller's duty to erase and to inform others who received
      the data is not.
    supported:
      1: true
      2: true
- id: cal-31
  source: ref-article-50
  question: What does Article 50 of the AI Act require?
  key_points:
  - Providers must inform people that they are interacting with an AI system.
  - Synthetic audio, image, video or text output must be marked as artificially generated.
  - Deployers must disclose deep fakes and inform people exposed to emotion recognition or biometric categorisation.
  answer: Article 50 of the AI Act requires providers and deployers of certain AI systems to ensure transparency,
    such as informing natural persons about interactions with AI systems, marking AI-generated content in a machine-readable
    format, and disclosing the artificial generation or manipulation of content [1, 2, 3, 5].
  passages:
    1: 2. Providers of AI systems, including general-purpose AI systems, generating synthetic audio, image, video
      or text content, shall ensure that the outputs of the AI system are marked in a machine-readable format and
      detectable as ar tificially generated or manipulated. Providers shall ensure their technical solutions are
      effective, interoperable, robust and reliable as far as this is technically feasible, taking into account
      the specificities and limitations of various types of content, the costs of implementation and the generally
      acknowledged state of the art, as may be reflected in relevant technical standards. This obligation shall
      not apply to the extent the AI systems perform an assistive function for standard editing or do not substantially
      alter the input data provided by the deployer or the semantics thereof, or where authorised by law to detect
      , prevent, investigate or prosecute criminal offences.
    2: 1. Providers shall ensure that AI systems intended to interact directly with natural persons are designed
      and developed in suc h a way that the natural persons concerned are informed that they are interacting with
      an AI system, unless this is obvious from the point of view of a natural person who is reasonably well-informed,
      observant and circumspect, taking into account the circumstances and the context of use. This obligation shall
      not apply to AI systems authorised by law to detect , prevent, investigate or prosecute criminal offences,
      subject to appropriate safeguards for the rights and freedoms of third parties, unless those systems are available
      for the public to report a criminal offence.
    3: '4. Deployers of an AI system that generates or manipulates image, audio or video content constituting a
      deep fake, shall disclose that the content has been artificially generated or manipulated. This obligation
      shall not apply where the use is authorised by law to detect, prevent, investigate or prosecute criminal offence.
      Where the content forms part of an evidently artistic, creative, satirical, fictional or analogous work or
      programme, the transparency obligations set out in this paragraph are limited to disclosure of the existence
      of such generated or manipulated content in an appropriate manner that does not hamper the display or enjoyment
      of the work.

      Deployers of an AI system that generates or manipulates text which is published with the purpose of informing
      the public on matters of public interest shall disclose that the text has been artificially generated or manipulated.
      This obligation shall not apply where the use is authorised by law to detect, prevent, investigate or prosecute
      criminal offences or where the AI-generated content has undergone a process of human review or editorial control
      and where a natural or legal person holds editorial responsibility for the publication of the content.'
    5: 2. Dostawcy systemów AI, w tym systemów AI ogólnego zastosowania, generujących treści w postaci syntetycznych
      dźwięków , obrazów , wideo lub tekstu, zapewniają , aby wyniki systemu AI zostały oznakowane w formacie nadającym
      się do odczytu maszynowego i były wykrywalne jako sztucznie wygenerowane lub zmanipulowane. Dostawcy zapewniają
      skuteczność, interoperacyjność, solidność i niezawodność swoich rozwiązań technicznych w zakresie, w jakim
      jest to technicznie wykonalne, uwzględniając przy tym specyfikę i ograniczenia różnych rodzajów treści, koszty
      wdrażania oraz powszechnie uznany stan wiedzy technicznej, co może być odzwierciedlone w odpowiednich normach
      technicznych . Obowiązek ten nie ma zastosowania w zakresie, w jakim systemy AI pełnią funkcję wspomagającą
      w zakresie standardowej edycji lub nie zmieniają w istotny sposób przekazywanych przez podmiot stosujący danych
      wejściowych lub ich semantyki, ani w zakresie, w jakim jest to dozwolone na mocy prawa do celów wykrywania
      przestępstw , zapobiegania im, prowadzenia postępowań przygotowawczych w ich sprawie lub ścigania ich sprawców
      .
  expected:
    correctness: partial
    reason: Informing people and marking synthetic content are there; deep fakes are covered, emotion recognition
      and biometric categorisation are not.
    supported:
      1: true
- id: cal-32
  source: span-access-and-rectification
  question: Which rights does a data subject have to access and to rectify personal data?
  key_points:
  - The data subject can obtain confirmation of processing, access to the data, and information such as purposes
    and recipients.
  - The data subject can obtain a copy of the data.
  - The data subject can have inaccurate data rectified without undue delay, and incomplete data completed.
  answer: A data subject has the right to access personal data and obtain information about its processing, including
    the purposes of processing, categories of data, recipients, and storage periods [1]. They also have the right
    to rectify inaccurate personal data and request its completion [2].
  passages:
    1: '1. The data subject shall have the right to obtain from the controller confirmation as to whether or not
      personal data concer ning him or her are being processed, and, where that is the case, access to the personal
      data and the following information:

      (a) the purposes of the processing;

      (b) the categories of personal data concerned;

      (c) the recipients or categories of recipient to whom the personal data have been or will be disclosed, in
      particular recipients in third countries or international organisations;

      (d) where possible, the envisaged period for which the personal data will be stored, or , if not possible,
      the criteria used to determine that period;

      (e) the existence of the right to request from the controller rectification or erasure of personal data or
      restriction of processing of personal data concerning the data subject or to object to such processing;

      (f) the right to lodge a complaint with a supervisory authority;

      (g) where the personal data are not collected from the data subject, any available information as to their
      source;

      (h) the existence of automated decision-making, including profiling, referred to in Article 22(1) and (4)
      and, at least in those cases, meaningful information about the logic involved, as well as the significance
      and the envisaged consequences of such processing for the data subject.'
    2: The data subject shall have the right to obtain from the controller without undue delay the rectification
      of inaccurate personal data concerning him or her . Taking into account the purposes of the processing, the
      data subject shall have the r ight to have incomplete personal data completed, including by means of providing
      a supplementary statement.
  expected:
    correctness: partial
    reason: Access with its information and rectification with completion are there; the copy is not.
    supported:
      1: true
      2: true
- id: cal-33
  source: tool-get-article-pl
  question: Co stanowi art. 17 RODO?
  key_points:
  - Art. 17 daje osobie, której dane dotyczą, prawo do usunięcia danych („prawo do bycia zapomnianym”).
  - Administrator usuwa dane bez zbędnej zwłoki, gdy zachodzi jedna z wymienionych okoliczności, np. dane nie są
    już niezbędne lub cofnięto zgodę.
  - Prawo to nie ma zastosowania m.in. ze względu na wolność wypowiedzi, obowiązek prawny lub interes publiczny.
  answer: Art. 17 RODO stanowi prawo do usunięcia danych („prawo do bycia zapomnianym”), które umożliwia osobie,
    której dane dotyczą, żądanie usunięcia danych osobowych w określonych sytuacjach [1, 4].
  passages:
    1: '1. Osoba, której dane dotyczą, ma prawo żądania od administratora niezwłocznego usunięcia dotyczących jej
      danych osobowych, a administrator ma obowiązek bez zbędnej zwłoki usunąć dane osobowe, jeżeli zachodzi jedna
      z następujących okoliczności:

      a) dane osobowe nie są już niezbędne do celów , w których zostały zebrane lub w inny sposób przetwarzane;

      PL

      b) osoba, której dane dotyczą, cofnęła zgodę, na której opiera się przetwarzanie zgodnie z art. 6 ust. 1 lit.
      a) lub art. 9 ust. 2 lit. a), i nie ma innej podstawy prawnej przetwarzania;

      c) osoba, której dane dotyczą, wnosi sprzeciw na mocy art. 21 ust. 1 wobec przetwarzania i nie występują nadrzędne
      prawnie uzasadnione podstawy przetwarzania lub osoba, której dane dotyczą, wnosi sprzeciw na mocy art. 21
      ust. 2 wobec przetwarzania;

      d) dane osobowe były przetwarzane niezgodnie z prawem;

      e) dane osobowe muszą zostać usunięte w celu wywiązania się z obowiązku prawnego przewidzianego w prawie Unii
      lub prawie państwa członkowskiego, któremu podlega administrator;

      f) dane osobowe zostały zebrane w związku z oferowaniem usług społeczeństwa informacyjnego, o których mowa
      w art. 8 ust. 1.'
    4: '1. The data subject shall have the right to obtain from the controller the erasure of personal data concerning
      him or her without undue delay and the controller shall have the obligation to erase personal data without
      undue delay where one of the following grounds applies:

      (a) the personal data are no longer necessary in relation to the purposes for which they were collected or
      otherwise processed;

      (b) the data subject withdraws consent on which the processing is based according to point (a) of Article
      6(1), or point (a) of Article 9(2), and where there is no other legal ground for the processing;

      (c) the data subject objects to the processing pursuant to Article 21(1) and there are no overriding legitimate
      grounds for the processing, or the data subject objects to the processing pursuant to Article 21(2);

      (d) the personal data have been unlawfully processed;

      (e) the personal data have to be erased for compliance with a legal obligation in Union or Member State law
      to which the controller is subject;

      (f) the personal data have been collected in relation to the offer of information society services referred
      to in Article 8(1).'
  expected:
    correctness: partial
    reason: Names the right; 'in certain situations' does not give the grounds, and the exceptions are missing.
    supported:
      1: true
